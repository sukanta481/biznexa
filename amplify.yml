version: 1
frontend:
  phases:
    preBuild:
      commands:
        # @aws-sdk/client-s3 requires Node >= 20. Next itself is happy on 18, so
        # without this pin the build image's default can be too old.
        - nvm install 20
        - nvm use 20
        - node -v
        - npm ci
    build:
      commands:
        # Write Amplify env vars into .env.production so they're available at SSR runtime
        - echo "DB_TARGET=$DB_TARGET" >> .env.production
        - echo "DB_LIVE_HOST=$DB_LIVE_HOST" >> .env.production
        - echo "DB_LIVE_PORT=$DB_LIVE_PORT" >> .env.production
        - echo "DB_LIVE_NAME=$DB_LIVE_NAME" >> .env.production
        - echo "DB_LIVE_USER=$DB_LIVE_USER" >> .env.production
        - echo "DB_LIVE_PASSWORD=$DB_LIVE_PASSWORD" >> .env.production
        # S3 media storage. Without these the upload route falls back to writing
        # public/uploads, which fails on Amplify's read-only SSR filesystem.
        - echo "S3_BUCKET=$S3_BUCKET" >> .env.production
        - echo "S3_REGION=$S3_REGION" >> .env.production
        - echo "S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID" >> .env.production
        - echo "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY" >> .env.production
        - echo "S3_ENDPOINT=$S3_ENDPOINT" >> .env.production
        - echo "S3_FORCE_PATH_STYLE=$S3_FORCE_PATH_STYLE" >> .env.production
        - echo "S3_PUBLIC_BASE=$S3_PUBLIC_BASE" >> .env.production
        # Encryption key for integration_credentials. Set once and never rotated.
        - echo "CREDENTIALS_KEY=$CREDENTIALS_KEY" >> .env.production
        # WhatsApp and SMTP fall back to these until the credentials are entered
        # on /admin/settings/integrations. Remove them once that page shows
        # "database" as the source for every field.
        - echo "WHATSAPP_TOKEN=$WHATSAPP_TOKEN" >> .env.production
        - echo "WHATSAPP_PHONE_NUMBER_ID=$WHATSAPP_PHONE_NUMBER_ID" >> .env.production
        - echo "WHATSAPP_INGEST_SECRET=$WHATSAPP_INGEST_SECRET" >> .env.production
        - echo "SMTP_HOST=$SMTP_HOST" >> .env.production
        - echo "SMTP_PORT=$SMTP_PORT" >> .env.production
        - echo "SMTP_SECURE=$SMTP_SECURE" >> .env.production
        - echo "SMTP_USER=$SMTP_USER" >> .env.production
        - echo "SMTP_PASS=$SMTP_PASS" >> .env.production
        - echo "CONTACT_FROM_EMAIL=$CONTACT_FROM_EMAIL" >> .env.production
        - echo "CONTACT_NOTIFICATION_EMAIL=$CONTACT_NOTIFICATION_EMAIL" >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - 'node_modules/**/*'
      - '.next/cache/**/*'
